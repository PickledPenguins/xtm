# Packaging for xtm.
#
# This is an ADDITION to install.sh, not a replacement for it. xtm targets
# machines where you cannot install anything -- no pip, no network, often no
# write access outside your home directory -- and on those, copying one file
# is the only thing that works. install.sh stays the primary path and is what
# the README documents first.
#
# This file exists for the other case: a developer who wants `pip install -e .`
# for editable installs and tooling integration, or a distribution that
# prefers a wheel.
#
# xtm is deliberately a single module with no runtime dependencies. Keep it
# that way: the module docstring explains why, and CI runs the suite with
# PyYAML both present and absent to prove the optional dependency stays
# optional.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xtm"
version = "0.5"
description = "xterm + tmux workspace manager: named window layouts, per machine"
readme = "README.md"
requires-python = ">=3.6"
license = {file = "LICENSE"}
keywords = ["tmux", "xterm", "x11", "window-manager", "workspace"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Utilities",
]

# None. PyYAML is used when importable and a built-in parser is used when it
# is not, so it must never become a hard requirement.
dependencies = []

[project.optional-dependencies]
# Nicer YAML round-tripping when it happens to be available.
yaml = ["PyYAML>=3.12"]
# Everything needed to run `make check`.
dev = ["PyYAML>=3.12", "coverage>=7.2", "pyflakes"]

[project.scripts]
# cli(), not main(): cli() is the layer that turns XtmError into the
# documented one-line message and KeyboardInterrupt into exit 130. main()
# raises both, so an entry point pointing at it would give a pip-installed
# xtm a Python traceback where the copied script prints one line.
xtm = "xtm:cli"

[tool.setuptools]
py-modules = ["xtm"]
package-dir = {"" = "src"}

# Coverage. Two settings are what make the number mean anything:
#
#   branch    xtm is mostly branching logic over the output of external
#             tools, so line coverage alone overstates what is exercised.
#   parallel  the integration tests run src/xtm.py as a SUBPROCESS, and each
#             one writes its own data file for `coverage combine` to merge.
#
# Parallel mode is still not enough on its own: every subprocess must call
# coverage.process_startup(), which happens only when COVERAGE_PROCESS_START
# names this file and a .pth bootstrap is on the path. tests/run-tests.sh
# --coverage does both. Without it the figure collapses from ~97% to ~63%,
# because nearly the whole command layer runs in a child process -- a
# measurement artefact, not a regression.
#
# Read from this file by coverage.py 7.2 or newer (for exclude_also), which
# needs Python 3.11's tomllib or the tomli package: `coverage[toml]`.

[tool.coverage.run]
branch = true
parallel = true
source = ["xtm"]
# Hundreds of parallel data files, one per subprocess; under .build/ with
# everything else generated.
data_file = ".build/coverage/.coverage"

[tool.coverage.paths]
# The parent imports xtm as a module while the children execute the file by
# path. Both must fold onto one file, or every percentage is wrong.
source = ["src/xtm.py", "*/xtm.py"]

[tool.coverage.html]
directory = ".build/htmlcov"

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
# The floor compares against coverage.py's COMBINED figure -- statements and
# branch exits over one denominator -- which is the strictest of the three.
# It moves in steps earned by the tests that raised the number; never lower
# it to make a run pass. What stays uncovered is error handling that needs
# the filesystem to break underneath a running process, and the fcntl import
# fallback.
fail_under = 97
exclude_also = [
    # Non-POSIX platforms only; unreachable on the systems xtm targets.
    "except ImportError:  # pragma: no cover",
]
