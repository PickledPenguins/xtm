name: CI

on:
  push:
    branches: [main]
  pull_request:

# PyYAML is xtm's one runtime dependency, so every job installs it.

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML

      # The commit gate first: it fails in seconds when something is broadly
      # broken, so the matrix does not spend six minutes discovering it.
      - name: Fast suite
        run: tests/run-tests.sh --fast

      - name: Run the suite
        run: python -m unittest discover -t . -s tests -v

  legacy:
    name: py3.6 compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Run 3.6 inside a container rather than as a container: job. The
      # checkout and setup actions need a Node runtime that will not start
      # on an image this old, so the job stays on a modern runner and only
      # the interpreter is old.
      - name: Run the suite under Python 3.6
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.6-slim \
            sh -c "pip install --quiet PyYAML && python -m unittest discover -t . -s tests"

  # Mutation and property runs are their own job: both are slower than the
  # suite and neither is a pass/fail signal about this change alone -- a
  # surviving mutant means a test is missing, which is a gap in the suite
  # rather than a fault in the commit that revealed it.
  suite-quality:
    name: mutation · properties
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML

      # Every mutant must be killed by the suite. A survivor is reported
      # with the decision it broke and the tests that should have noticed.
      - name: Mutation catalog
        run: python tests/mutation/run.py

      # Generated inputs against stated properties. The engine is
      # tests/property/engine.py, so the suite needs nothing beyond PyYAML.
      - name: Property tests
        run: python tests/property/run.py

  check:
    name: lint · coverage · clean tree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --disable-pip-version-check "coverage[toml]" pyflakes PyYAML

      - name: Lint
        run: tests/run-tests.sh --lint

      # The documentation must describe the tool that ships with it: every
      # option, exit code, environment variable, config key and emitted JSON
      # key, enumerated from the code and looked for in the document that
      # owns it.
      - name: Documentation contract
        run: python -m unittest tests.test_documentation

      - name: Examples
        run: make examples

      # `make test` runs each module in its own interpreter, which catches a
      # test that only passes because an earlier module left global state
      # behind. The matrix job above runs them together, so both shapes are
      # covered.
      - name: Each test module in isolation
        run: make test

      # tests/run-tests.sh --coverage sets up subprocess tracking. Without
      # it the integration tests, which run src/xtm.py as a child process,
      # contribute nothing and the figure drops from ~97% to ~63%. The floor
      # in pyproject.toml fails the job on a drop.
      - name: Coverage
        run: make coverage

      # Proves .gitignore actually covers everything the suite produces --
      # a full run leaves hundreds of parallel-mode coverage data files.
      - name: Working tree must be clean after a full run
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after a full run:"
            git status --porcelain
            echo "Add the offending paths to .gitignore."
            exit 1
          fi
          echo "Working tree clean."
