# One laptop, two screen arrangements, chosen by hand rather than by host:
# the hostname is the same either way, so these cannot be auto-selected.
profiles:
  # Undocked: one small screen, everything stacked into it.
  mobile:
    prefix: m-
    stack: {x: 40, y: 40, width: 900, height: 650, offset_x: 40, offset_y: 40}
    sessions:
      editor: {x: 0, y: 0, width: 1440, height: 900}
      shell: {x: 0, y: 900, width: 1440, height: 500}

  # Docked: the laptop panel plus a 2560-wide monitor to its right.
  docked:
    prefix: m-
    on_switch: leave
    stack: {x: 40, y: 40, width: 900, height: 650, offset_x: 40, offset_y: 40}
    sessions:
      editor: {x: 1440, y: 0, width: 1600, height: 1400}
      reference: {x: 3040, y: 0, width: 960, height: 1400}
      shell: {x: 0, y: 0, width: 1440, height: 700}
      logs: {x: 0, y: 700, width: 1440, height: 700}
