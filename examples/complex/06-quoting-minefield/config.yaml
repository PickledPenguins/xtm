# Every value that needs quoting, in one working profile. Unquoted, YAML
# would read each of these as a number, a boolean or a date rather than the
# text written, so a config that uses all of them is the test that quoting
# is enough.
profiles:
  desk:
    prefix: desk-
    stack: {x: 40, y: 40, width: 900, height: 650, offset_x: 40, offset_y: 40}
    sessions:
      octal:
        x: 0
        y: 0
        width: 600
        height: 400
        title: "0755"                    # octal 493 unquoted
      sexagesimal:
        x: 600
        y: 0
        width: 600
        height: 400
        title: "1:30"                    # the number 90 unquoted
      boolean:
        x: 1200
        y: 0
        width: 600
        height: 400
        title: "yes"                     # the boolean true unquoted
      date:
        x: 0
        y: 400
        width: 600
        height: 400
        title: "2026-01-01"              # a date unquoted
      separators:
        x: 600
        y: 400
        width: 600
        height: 400
        title: "1_000"                   # the number 1000 unquoted
      scientific:
        x: 1200
        y: 400
        width: 600
        height: 400
        title: "1e3"                     # text to YAML 1.1, but a number to newer readers
      escapes:
        x: 0
        y: 800
        width: 600
        height: 400
        command: 'grep -e "\d\+" log'    # single quotes: the backslashes are literal
      font:
        x: 600
        y: 800
        width: 600
        height: 400
        xterm_args: [-fa, "Monospace:size=11"]   # a colon inside a list item
      infinity:
        x: 1200
        y: 800
        width: 600
        height: 400
        title: ".inf"                    # infinity unquoted
