# Values that must be quoted, and why.
#
# YAML types an unquoted value: a handful of spellings that look like text
# are numbers, booleans or dates. Quoting keeps the text as written.
profiles:
  default:
    stack: {x: 40, y: 40, width: 900, height: 650, offset_x: 40, offset_y: 40}
    sessions:
      editor:
        x: 0
        y: 0
        width: 1200
        height: 1400
        # "0755" unquoted is the octal number 493. Quoted, it is the text.
        title: "0755"
      shell:
        x: 1200
        y: 0
        width: 720
        height: 700
        # "yes" unquoted is the boolean true under YAML 1.1.
        title: "yes"
      logs:
        x: 1200
        y: 700
        width: 720
        height: 700
        # A time-looking value: 1:30 unquoted is the number 90.
        title: "1:30"
        # A backslash is literal inside SINGLE quotes. Inside double quotes
        # YAML processes escapes, and \d is not one it knows, so the
        # double-quoted form is invalid YAML.
        command: 'grep -e ^\d'
